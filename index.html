<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Universal Messenger (PC & Mobile)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-[100dvh] flex flex-col overflow-hidden font-sans">

    <!-- BARRA SUPERIOR -->
    <header class="bg-slate-800 border-b border-slate-700 p-3 flex justify-between items-center shadow-md z-10 shrink-0">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 rounded-full bg-rose-500 transition-colors duration-300" id="connection-status" title="Desconectado"></div>
            <h1 class="text-sm md:text-base font-bold tracking-wide">P2P Cross-Device</h1>
        </div>
        <div class="flex items-center space-x-2">
            <input type="text" id="room-input" placeholder="ID Sala" class="bg-slate-700 px-3 py-1.5 rounded text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-24 md:w-36">
            <button onclick="joinRoom()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded text-xs md:text-sm font-semibold transition">Conectar</button>
        </div>
    </header>

    <!-- CUERPO PRINCIPAL -->
    <div class="flex flex-1 flex-col md:flex-row overflow-hidden relative">

        <!-- ZONAS DE CHAT (Doble Zona) -->
        <main class="flex-1 flex flex-col bg-slate-900 overflow-hidden">
            <!-- Selector de Zonas -->
            <div class="flex bg-slate-800 border-b border-slate-700 text-xs md:text-sm shrink-0">
                <button onclick="switchZone('zone1')" id="btn-zone1" class="flex-1 py-2.5 font-semibold text-indigo-400 border-b-2 border-indigo-500 transition">Zona Principal</button>
                <button onclick="switchZone('zone2')" id="btn-zone2" class="flex-1 py-2.5 font-semibold text-slate-400 hover:text-slate-200 transition">Zona Secundaria</button>
            </div>

            <!-- Contenedor Zona 1 -->
            <div id="chat-zone1" class="flex-1 p-3 overflow-y-auto custom-scrollbar space-y-3">
                <div class="text-center text-[10px] text-slate-500 my-1">-- Zona 1 Lista --</div>
            </div>

            <!-- Contenedor Zona 2 -->
            <div id="chat-zone2" class="flex-1 p-3 overflow-y-auto custom-scrollbar space-y-3 hidden">
                <div class="text-center text-[10px] text-slate-500 my-1">-- Zona 2 Lista --</div>
            </div>

            <!-- Input de Texto -->
            <div class="p-2.5 bg-slate-800 border-t border-slate-700 flex items-center space-x-2 shrink-0">
                <input type="text" id="message-input" placeholder="Mensaje cifrado P2P..." class="flex-1 bg-slate-700 px-3 py-2 rounded-lg text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition">Enviar</button>
            </div>
        </main>

        <!-- PANEL DE VÍDEO (Flotante y Adaptable) -->
        <aside class="absolute bottom-3 right-3 md:relative md:bottom-auto md:right-auto w-36 md:w-64 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl flex flex-col overflow-hidden z-20 shrink-0">
            <div class="bg-slate-750 px-2 py-1 text-[10px] md:text-xs font-semibold text-slate-300 flex justify-between items-center border-b border-slate-700">
                <span>Vídeo Directo</span>
                <button onclick="switchCamera()" class="text-indigo-400 hover:text-indigo-300" title="Cambiar Cámara">🔄</button>
            </div>
            <div class="relative bg-black aspect-video flex items-center justify-center">
                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <video id="local-video" autoplay playsinline muted class="absolute bottom-1 right-1 w-12 h-12 md:w-16 md:h-16 object-cover rounded-md border border-indigo-500 shadow"></video>
            </div>
            <div class="p-1.5 bg-slate-800 flex justify-around border-t border-slate-700">
                <button onclick="toggleAudio()" id="mic-btn" class="bg-slate-700 hover:bg-slate-600 p-1.5 rounded-full text-xs">🎤</button>
                <button onclick="toggleCam()" id="cam-btn" class="bg-slate-700 hover:bg-slate-600 p-1.5 rounded-full text-xs">📷</button>
            </div>
        </aside>

    </div>

    <script>
        const socket = io();
        let pc;
        let dataChannel;
        let localStream;
        let currentZone = 'zone1';
        let useFrontCamera = true;

        // Configuración ICE robusta con servidores STUN públicos gratuitos
        // Configuración TURN/STUN
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                {
                    urls: 'free.expressturn.com:3478',
                    username: '000000002102154901',
                    credential: 'zTwHEShFvegqotlDMnVBLEt7pTo='
                }
            ]
        };

        function switchZone(zone) {
            currentZone = zone;
            document.getElementById('chat-zone1').classList.toggle('hidden', zone !== 'zone1');
            document.getElementById('chat-zone2').classList.toggle('hidden', zone !== 'zone2');
            document.getElementById('btn-zone1').className = zone === 'zone1' ? 'flex-1 py-2.5 font-semibold text-indigo-400 border-b-2 border-indigo-500 transition' : 'flex-1 py-2.5 font-semibold text-slate-400 hover:text-slate-200 transition';
            document.getElementById('btn-zone2').className = zone === 'zone2' ? 'flex-1 py-2.5 font-semibold text-indigo-400 border-b-2 border-indigo-500 transition' : 'flex-1 py-2.5 font-semibold text-slate-400 hover:text-slate-200 transition';
        }

        // Solicitar permisos de hardware con restricciones adaptadas a móviles y PC
        async function initMedia() {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: { 
                        width: { ideal: 640 }, 
                        height: { ideal: 360 },
                        facingMode: useFrontCamera ? 'user' : 'environment' 
                    },
                    audio: { echoCancellation: true, noiseSuppression: true }
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('local-video').srcObject = localStream;
                
                if (pc) {
                    const senders = pc.getSenders();
                    localStream.getTracks().forEach(track => {
                        const sender = senders.find(s => s.track && s.track.kind === track.kind);
                        if (sender) sender.replaceTrack(track);
                    });
                }
            } catch (err) {
                console.warn("Permiso de medios denegado o no disponible:", err);
                alert("Asegúrate de permitir el uso de la cámara y el micrófono en tu navegador.");
            }
        }

        async function switchCamera() {
            useFrontCamera = !useFrontCamera;
            await initMedia();
        }

        async function joinRoom() {
            const room = document.getElementById('room-input').value.trim();
            if (!room) return alert("Introduce un ID de sala válido");
            
            await initMedia();
            socket.emit('join-room', room);
            setupPeerConnection(true);
            appendSystemMessage("Solicitando conexión P2P...");
        }

        socket.on('user-joined', async (id) => {
            appendSystemMessage("Par detectado. Negociando conexión directa...");
            setupPeerConnection(false, id);
        });

        socket.on('signal', async (data) => {
            if (!pc) setupPeerConnection(false, data.from);
            if (data.signal.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
                if (data.signal.sdp.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { to: data.from, signal: { sdp: pc.localDescription } });
                }
            } else if (data.signal.candidate) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
                } catch (e) {
                    console.error("Error al añadir candidato ICE:", e);
                }
            }
        });

        function setupPeerConnection(isInitiator, remoteId) {
            pc = new RTCPeerConnection(rtcConfig);

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            // ANTI-CONGELAMIENTO: Control de eventos en flujos remotos
            pc.ontrack = (event) => {
                const remoteVideo = document.getElementById('remote-video');
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    remoteVideo.play().catch(e => console.log("Reproducción automática bloqueada por políticas del navegador:", e));
                }
            };

            pc.onicecandidate = (event) => {
                if (event.candidate && remoteId) {
                    socket.emit('signal', { to: remoteId, signal: { candidate: event.candidate } });
                }
            };

            if (isInitiator) {
                dataChannel = pc.createDataChannel("p2p-chat");
                setupDataChannel();
                pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                    // Esperando intercambio de señalización
                });
            } else {
                pc.ondatachannel = (event) => {
                    dataChannel = event.channel;
                    setupDataChannel();
                };
            }
        }

        function setupDataChannel() {
            dataChannel.onopen = () => {
                document.getElementById('connection-status').className = "w-3 h-3 rounded-full bg-emerald-500";
                appendSystemMessage("¡Conexión P2P Establecida con éxito!");
            };
            dataChannel.onclose = () => {
                document.getElementById('connection-status').className = "w-3 h-3 rounded-full bg-rose-500";
                appendSystemMessage("Conexión P2P interrumpida.");
            };
            dataChannel.onmessage = (event) => {
                const data = JSON.parse(event.data);
                appendMessage(data.text, 'remote', data.zone);
            };
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const payload = JSON.stringify({ text, zone: currentZone });
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(payload);
                appendMessage(text, 'local', currentZone);
                input.value = '';
            } else {
                alert("Canal de datos no conectado todavía.");
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(text, sender, zone) {
            const chatBox = document.getElementById(`chat-${zone}`);
            const div = document.createElement('div');
            div.className = `flex ${sender === 'local' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="max-w-[75%] md:max-w-md px-3 py-1.5 rounded-2xl text-xs md:text-sm ${sender === 'local' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-700 text-slate-100 rounded-bl-none'} shadow">${text}</div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            const chatBox = document.getElementById(`chat-${currentZone}`);
            const div = document.createElement('div');
            div.className = "text-center my-1";
            div.innerHTML = `<span class="bg-slate-800 text-slate-400 text-[10px] px-2.5 py-0.5 rounded-full border border-slate-700">${text}</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function toggleAudio() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            document.getElementById('mic-btn').classList.toggle('bg-rose-600', !audioTrack.enabled);
        }

        function toggleCam() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            videoTrack.enabled = !videoTrack.enabled;
            document.getElementById('cam-btn').classList.toggle('bg-rose-600', !videoTrack.enabled);
        }
    </script>
</body>
</html>
